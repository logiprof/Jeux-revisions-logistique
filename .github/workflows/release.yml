# Publie une nouvelle version de l'extension.
# Il suffit d'augmenter la version (en-tête « Version », constante JRL_VERSION, « Stable tag » du readme.txt)
# et de pousser sur main : si la release vX.Y.Z n'existe pas encore, elle est créée avec le zip de l'extension.
# Un push sur main sans changement de version ne publie rien. Un tag vX.Y.Z ou un lancement manuel
# (onglet Actions > Publier une version > Run workflow) reconstruit et remplace le zip de la version courante.
# Les sites WordPress proposent ensuite la mise à jour (et l'installent seuls si l'option est cochée).
name: Publier une version
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Vérifier le numéro de version
        run: |
          V=$(grep -m1 -oP '^ \* Version:\s*\K[0-9.]+' jeux-revisions-logistique.php)
          C=$(grep -m1 -oP "define\( 'JRL_VERSION', '\K[0-9.]+" jeux-revisions-logistique.php)
          S=$(grep -m1 -oP '^Stable tag:\s*\K[0-9.]+' readme.txt)
          echo "en-tête $V · constante $C · readme $S · réf. ${GITHUB_REF_NAME}"
          [ "$V" = "$C" ] && [ "$V" = "$S" ] || { echo "::error::Les trois numéros de version doivent être identiques."; exit 1; }
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "${GITHUB_REF_NAME#v}" != "$V" ]; then echo "::error::Le tag ${GITHUB_REF_NAME} ne correspond pas à la version $V."; exit 1; fi
          echo "VERSION=$V" >> "$GITHUB_ENV"
      - name: Version déjà publiée ?
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "v$VERSION" >/dev/null 2>&1 && [ "${GITHUB_REF_TYPE}" = "branch" ] && [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            echo "La version $VERSION est déjà publiée : rien à faire."; echo "PUBLIER=0" >> "$GITHUB_ENV"
          else
            echo "PUBLIER=1" >> "$GITHUB_ENV"
          fi
      - name: Vérifier la syntaxe PHP
        run: for f in $(git ls-files '*.php'); do php -l "$f" >/dev/null || exit 1; done
      - name: Construire le zip
        if: env.PUBLIER == '1'
        run: bash outils/construire_zip.sh dist
      - name: Publier la release
        if: env.PUBLIER == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v$VERSION"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/jeux-revisions-logistique.zip --clobber
          else
            gh release create "$TAG" dist/jeux-revisions-logistique.zip --target "$GITHUB_SHA" --title "Version $VERSION" --generate-notes
          fi
